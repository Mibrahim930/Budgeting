# Fly.io config for the paycheck-planner app. To rename, change `app` and the two URLs below.
# See README.md -> Deploying.
app = "paycheck-planner"
primary_region = "iad"

[build]

[env]
  ORIGIN = "https://paycheck-planner.fly.dev"
  BETTER_AUTH_URL = "https://paycheck-planner.fly.dev"
  # Real client IP for rate limiting (set by Fly's edge).
  ADDRESS_HEADER = "Fly-Client-IP"
  APP_TIMEZONE = "America/New_York"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite lives on one volume, so run exactly one always-on machine (background sync needs it).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "budget_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
